# ================================================
# Deploy to GitHub Pages
# 触发：push 到 master / Issues 事件 / 每 15 分钟 / 手动
# 流程：生成 items.json 快照（GitHub Issues）→ vite build → 部署 Pages
# 零服务器：站点读取 Items 快照，发布/管理走 GitHub 原生界面
# ================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate items.json from GitHub Issues
        run: node scripts/gen-items.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages source (GitHub Actions)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "尝试将 Pages 源切换为 GitHub Actions…"
          if curl -sSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"build_type":"workflow"}' >/dev/null; then
            echo "已创建 Pages（GitHub Actions 源）"
          else
            echo "POST 失败，尝试 PATCH 更新…"
            curl -sSf -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pages" \
              -d '{"build_type":"workflow"}' >/dev/null \
              || echo "（若已为 GitHub Actions 源则忽略；否则请到 Settings → Pages 手动选择 GitHub Actions）"
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
