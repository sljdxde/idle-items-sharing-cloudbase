# ================================================
# Deploy to GitHub Pages (Actions 部署模式)
# 触发：push 到 master / Issues 变更 / 手动
# 流程：生成 items.json 快照（GitHub Issues）→ vite build → 部署 Pages
# 零服务器：站点读取 Items 快照，发布/管理走 GitHub 原生界面
# 前置：仓库 Settings → Pages → Source 已设为 "GitHub Actions"（build_type: workflow）
# ================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate items.json from GitHub Issues
        run: node scripts/gen-items.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
