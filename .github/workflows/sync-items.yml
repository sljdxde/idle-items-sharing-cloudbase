# ================================================
# sync-items.yml — 定时把 GitHub Issues 生成静态 items.json
# 解决纯前端匿名读 api.github.com 的 60/hr 共享 IP 速率限制（403）。
# 前端改读同源静态文件：无速率限制、无 CORS、无需任何服务器。
# 仅依赖 Actions 自带的 GITHUB_TOKEN（高配额、独立鉴权，不占用户出口 IP）。
# ================================================
name: Sync Items JSON

on:
  schedule:
    - cron: '*/15 * * * *'   # 每 15 分钟同步一次（公开仓库 Actions 免费）
  workflow_dispatch:         # 支持手动触发
  # 物品变更（发布/借阅/归还）后近实时刷新：监听 issue 事件
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]

permissions:
  contents: write            # 需要写回 items.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成 items.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const DATA_RE = /<!--DATA_START([\s\S]*?)DATA_END-->/;

            const res = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'item',
              per_page: 100,
              sort: 'updated',
            });

            const items = res.data
              .filter(i => !i.pull_request)   // 排除 PR
              .map(issue => {
                let d = {};
                const m = issue.body ? issue.body.match(DATA_RE) : null;
                if (m && m[1]) { try { d = JSON.parse(m[1].trim()); } catch (e) {} }
                const isLent = (issue.labels || []).some(l => l.name === 'lent');
                return {
                  id: issue.number,
                  name: d.name || issue.title || '未知物品',
                  desc: d.desc || '',
                  contact: d.contact || '',
                  building: d.building || '',
                  lat: d.lat || null,
                  lng: d.lng || null,
                  imgUrl: (function () {
                    if (d.imgUrl) return d.imgUrl;
                    const _im = issue.body && issue.body.match(/https:\/\/user-images\.githubusercontent\.com\/[^\s)>"']+/);
                    return _im ? _im[0] : '';
                  })(),
                  status: d.status || (isLent ? 'borrowed' : 'available'),
                  category: d.category || '',
                  requests: Array.isArray(d.requests) ? d.requests : [],
                  pinCipher: d.pinCipher || '',
                  hasLegacyPin: !!d.pin,
                  createTime: issue.created_at,
                };
              });

            fs.writeFileSync('items.json', JSON.stringify(items, null, 2));

      - name: 有变化才提交（避免空跑刷 commit）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain items.json)" ]; then
            git add items.json
            git commit -m "chore: auto-sync items.json"
            git push
          else
            echo "items.json 无变化，跳过提交"
          fi
