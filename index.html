<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邻里好物 — 社区闲置互助</title>
  <meta name="description" content="让好物在邻里间流转，发现小区邻居的闲置好物">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav class="navbar">
    <div class="nav-container">
      <h1 class="logo">🏘️ 邻里好物</h1>
      <div class="nav-links">
        <a href="index.html" class="active">首页</a>
        <a href="publish.html" class="btn-publish">✨ 发布闲置</a>
      </div>
    </div>
  </nav>

  <!-- Hero 区域 -->
  <section class="hero">
    <span class="hero-badge">🌿 社区闲置 · 互助共享</span>
    <h2>让好物在邻里间流转</h2>
    <p>发现小区邻居的闲置好物，借用或分享，让物品继续发光发热</p>
  </section>

  <!-- 距离筛选栏 -->
  <div class="filter-bar">
    <div class="location-status">
      <span class="icon">📍</span>
      <span id="locationText">正在定位...</span>
    </div>
    <div class="filter-pills">
      <span class="filter-pill" data-range="500" onclick="setRange(500)">500m</span>
      <span class="filter-pill active" data-range="1000" onclick="setRange(1000)">1km</span>
      <span class="filter-pill" data-range="3000" onclick="setRange(3000)">3km</span>
      <span class="filter-pill" data-range="0" onclick="setRange(0)">全部</span>
    </div>
  </div>

  <main class="container">
    <div id="loading" class="loading-spinner">
      <div class="spinner"></div>
      <p>正在加载物品列表...</p>
    </div>

    <div id="item-list" class="item-grid" style="display: none;">
      <!-- 卡片由 JS 动态渲染 -->
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
      <p style="font-size: 1.2rem; margin-bottom: 8px;">📦</p>
      <p>附近暂无闲置物品</p>
      <p>去<a href="publish.html">发布第一件</a>吧！</p>
    </div>
  </main>

  <!-- 借阅申请弹窗 -->
  <div id="borrowModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <button type="button" class="modal-close" onclick="closeBorrowModal()" aria-label="关闭">×</button>
      <h3>🤝 借阅申请</h3>
      <p style="font-size: 0.82rem; color: #64748b; margin-bottom: 12px;">填写联系方式，物主会收到通知</p>
      <input type="text" id="borrowName" placeholder="你的昵称" maxlength="20">
      <input type="text" id="borrowContact" placeholder="联系方式（微信 / 楼号）" maxlength="40" style="margin-top:8px;">
      <textarea id="borrowMsg" rows="2" placeholder="留言（可选）" style="margin-top:8px;"></textarea>
      <div class="modal-actions" style="margin-top:14px;">
        <button class="btn-success" onclick="submitBorrow()">提交申请</button>
        <button class="btn-cancel" onclick="closeBorrowModal()">取消</button>
      </div>
    </div>
  </div>

  <!-- 管理弹窗（物主） -->
  <div id="manageModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <button type="button" class="modal-close" onclick="closeManageModal()" aria-label="关闭">×</button>
      <h3>⚙️ 物品管理</h3>
      <p style="font-size: 0.82rem; color: #64748b; margin-bottom: 10px;">输入发布时设置的 4 位管理密码 (PIN)</p>
      <input type="text" id="managePinInput" placeholder="• • • •" maxlength="4">
      <div id="manageBody"></div>
      <button class="btn-cancel" style="width:100%;margin-top:10px;" onclick="closeManageModal()">取消</button>
    </div>
  </div>

  <!-- 页脚 -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <div class="footer-brand">🏘️ 邻里好物</div>
        <div class="footer-tag">让闲置在邻里间发光发热</div>
      </div>
      <nav class="footer-links">
        <a href="index.html">首页</a>
        <a href="publish.html">发布闲置</a>
        <a href="https://github.com/sljdxde/idle-items-sharing-cloudbase" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
    <div class="footer-copy">由社区共建 · 数据存于 GitHub Issues · © 2026 邻里好物</div>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initApp('index');
    });
  </script>
</body>

</html>
