<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布闲置 — 邻里好物</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav class="navbar">
    <div class="nav-container">
      <h1 class="logo">
        <span class="logo-mark" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/><path d="M9.5 19v-5h5v5"/></svg>
        </span>
        邻里好物
      </h1>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="publish.html" class="btn-publish active">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          发布闲置
        </a>
      </div>
    </div>
  </nav>

  <main class="container form-container">
    <div class="form-card">
      <h2>发布闲置物品</h2>
      <p class="form-subtitle">填写几步即可上架，让邻居借走你的好物</p>

      <form id="publish-form">
        <!-- 分区一：物品信息 -->
        <div class="form-section">
          <div class="form-section-title">
            <span class="step">1</span>
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>
            物品信息
          </div>

          <div class="form-group">
            <label for="itemName">物品名称 <span class="required">*</span></label>
            <input type="text" id="itemName" placeholder="例如：九成新戴森吸尘器" required maxlength="50">
          </div>

          <div class="form-group">
            <label for="itemDesc">详细描述 <span class="required">*</span></label>
            <textarea id="itemDesc" rows="3" placeholder="描述物品的新旧程度、可借 / 可送等" required></textarea>
          </div>

          <div class="form-group" style="margin-bottom:0;">
            <label for="itemImage">物品照片 <span class="required">*</span></label>
            <input type="file" id="itemImage" accept="image/jpeg, image/png, image/webp" required>
            <div class="file-help">支持 jpg / png / webp，不超过 5MB</div>
            <div id="imagePreview" class="image-preview" style="display:none;">
              <img id="previewImg" src="" alt="预览图">
            </div>
          </div>
        </div>

        <!-- 分区二：位置与联系 -->
        <div class="form-section">
          <div class="form-section-title">
            <span class="step">2</span>
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 21s7-6.5 7-11a7 7 0 1 0-14 0c0 4.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
            位置与联系
          </div>

          <div class="form-group">
            <label>您的位置 <span class="required">*</span></label>
            <div class="location-group">
              <button type="button" id="btnLocate" class="btn-locate" onclick="doLocate()">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 21s7-6.5 7-11a7 7 0 1 0-14 0c0 4.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
                点击获取位置
              </button>
              <span id="locateStatus" class="location-text">未定位</span>
            </div>
            <input type="hidden" id="itemLat">
            <input type="hidden" id="itemLng">
            <div id="miniMap" style="display:none; margin-top: var(--sp-3);"></div>
          </div>

          <div class="form-group">
            <label for="itemBuilding">楼号门牌 <span class="req-note">（与联系方式二选一）</span></label>
            <input type="text" id="itemBuilding" placeholder="例如：3 栋 2 单元 1801">
          </div>

          <div class="or-divider">或</div>

          <div class="form-group" style="margin-bottom:0;">
            <label for="itemContact">联系方式 <span class="req-note">（微信 / 手机号）</span></label>
            <input type="text" id="itemContact" placeholder="例如：微信 xxx 或 手机号">
          </div>
        </div>

        <!-- 分区三：管理设置 -->
        <div class="form-section">
          <div class="form-section-title">
            <span class="step">3</span>
            <svg class="icon" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            管理设置
          </div>

          <div class="form-group" style="margin-bottom:0;">
            <label for="itemPin">管理密码 (PIN)</label>
            <input type="text" id="itemPin" placeholder="4 位数字（不填则自动生成）" maxlength="4">
            <div class="file-help">日后凭此密码下架或修改状态，将自动保存在本设备</div>
          </div>
        </div>

        <div id="uploadProgress" class="progress-container" style="display:none;">
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill" style="width: 0%"></div>
          </div>
          <p id="progressText" class="progress-text">准备中…</p>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg">发布物品</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <div class="footer-brand">
          <span class="logo-mark" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/><path d="M9.5 19v-5h5v5"/></svg>
          </span>
          邻里好物
        </div>
        <div class="footer-tag">让闲置在邻里间发光发热</div>
      </div>
      <nav class="footer-links">
        <a href="index.html">首页</a>
        <a href="publish.html">发布闲置</a>
        <a href="https://github.com/sljdxde/idle-items-sharing-cloudbase" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
    <div class="footer-copy">由社区共建 · 数据存于 GitHub Issues · © 2026 邻里好物</div>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initApp('publish');
    });
  </script>
</body>

</html>
